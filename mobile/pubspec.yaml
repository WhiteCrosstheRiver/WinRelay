name: winrelay
description: Control one PC window at a time from your phone.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  web_socket_channel: ^3.0.1
  webview_flutter: ^4.10.0
  mobile_scanner: ^5.2.3
  share_plus: ^10.0.2
  open_filex: ^4.5.0
  shared_preferences: ^2.3.2
  uuid: ^4.4.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
