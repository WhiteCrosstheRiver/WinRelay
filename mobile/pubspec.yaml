name: winrelay
description: Control one PC window at a time from your phone.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  web_socket_channel: ^3.0.1
  mobile_scanner: ^5.2.3
  shared_preferences: ^2.3.2
  wakelock_plus: ^1.2.8
  uuid: ^4.4.2

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
