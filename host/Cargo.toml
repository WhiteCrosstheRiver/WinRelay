[package]
name = "winrelay-host"
version = "0.1.0"
edition = "2021"
description = "WinRelay PC host: lists windows, streams one window to a phone, injects keystrokes"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
rand = "0.8"
chrono = "0.4"
dirs = "5"
socket2 = "0.5"
qrcode = "0.14"
jpeg-encoder = "0.6"
open = "5"
tracing = "0.1"
tracing-subscriber = "0.3"

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Power",
  "Win32_System_Shutdown",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
